spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/FinSight}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:FinSight@2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # WebSocket / STOMP
  websocket:
    allowed-origins: "*"

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:FinSight-Dev-Secret-Key-2026-Must-Be-At-Least-256-Bits-Long!!}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:9000}